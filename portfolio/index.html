<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Shubhan Chari — Portfolio</title>
  <link rel="preconnect" href="https://rsms.me/" crossorigin />
  <link rel="preload" href="https://rsms.me/inter/inter.css" as="style" />
  <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/motion@12.7.4/dist/motion.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <div class="page-bg" id="page-bg"></div>

    <div class="phone-container" id="phone-container">
      <div class="phone-frame">
        <div class="phone-bezel-overlay" id="bezel-overlay"></div>
        <div class="phone-inner-shadow" id="inner-shadow"></div>
        <div class="video-placeholder-overlay" id="video-placeholder" style="display:none;">
          <div class="placeholder-content">
            <div class="placeholder-icon">🎬</div>
            <p>Demo video coming soon</p>
          </div>
        </div>
        <div class="sheet-bg" id="sheet-bg"></div>

        <div class="phone-screen" id="phone-screen">
          <div id="screen-content"></div>
        </div>

        <div class="dynamic-island" id="dynamic-island"></div>
        <div class="home-bar" id="home-bar"></div>

        <!-- Video sheets for utility apps -->
        <video class="video-sheet" data-app="camera" muted playsinline loop></video>
        <video class="video-sheet" data-app="spotify" muted playsinline loop></video>
        <video class="video-sheet" data-app="google-maps" muted playsinline loop></video>
        <video class="video-sheet" data-app="photos" muted playsinline loop></video>
        <video class="video-sheet" data-app="pinterest" muted playsinline loop></video>
        <video class="video-sheet" data-app="github" muted playsinline loop></video>
        <video class="video-sheet" data-app="canva" muted playsinline loop></video>

        <!-- Folder video crossfade pair -->
        <video class="video-sheet folder-video" id="folder-video-a" muted playsinline loop></video>
        <video class="video-sheet folder-video" id="folder-video-b" muted playsinline loop></video>
      </div>
    </div>
  </div>

  <script type="module">
    import { squircleObserver } from "https://esm.sh/corner-smoothing";

    const el = (id) => document.getElementById(id);
    const phoneFrame = el("bezel-overlay");
    if (phoneFrame) squircleObserver(phoneFrame, { cornerRadius: 49 });
    const innerShadow = el("inner-shadow");
    if (innerShadow) squircleObserver(innerShadow, { cornerRadius: 49 });
    const phoneScreen = el("phone-screen");
    if (phoneScreen) squircleObserver(phoneScreen, { cornerRadius: 40 });
    const sheetBg = el("sheet-bg");
    if (sheetBg) squircleObserver(sheetBg, { cornerRadius: 40 });
    const dynamicIsland = el("dynamic-island");
    if (dynamicIsland) squircleObserver(dynamicIsland, { cornerRadius: 13 });
    const homeBar = el("home-bar");
    if (homeBar) squircleObserver(homeBar, { cornerRadius: 2.5 });
  </script>

  <script src="script.js"></script>
</body>
</html>
